buildscript {
  repositories {
    mavenLocal()
    mavenCentral()
  }

  dependencies {
    classpath "org.elasticsearch.gradle:build-tools:9.1.5"
  }
}

apply plugin: 'elasticsearch.esplugin'
apply plugin: 'elasticsearch.yaml-rest-test'

esplugin {
  name 'scorer-normalizer'
  description 'elasticsearch custom plugin - use NormalizedCustomRescorer to Normalize search reault score. (mix max, z-score, robust) by hys1753@naver.com'
  classname 'elasticsearch.custom.plugin.RescorerNormalizerPlugin'
}

group = "elasticsearch.plugin"
version = "9.1.5"
sourceCompatibility = '21'


repositories {
  mavenCentral()
}


dependencies {
  implementation group: 'org.elasticsearch', name: 'elasticsearch', version: '9.1.5'
  yamlRestTestRuntimeOnly "org.apache.logging.log4j:log4j-core"

  testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: '5.7.0'
  testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: '5.7.0'

}

test {
  useJUnitPlatform()
}

